spring:
  config:
    activate:
      on-profile: naver
  mail:
    host: smtp.naver.com
    port: 587
    username: ${NAVER_SMTP_USERNAME:${MAIL_USERNAME:}}
    password: ${NAVER_SMTP_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:${NAVER_SMTP_USERNAME:${MAIL_USERNAME:}}}
