spring:
  application:
    name: cobip
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret-key: ${JWT_SECRET_KEY:local-development-jwt-secret-key-change-me-32-bytes}
  issuer: ${JWT_ISSUER:cobip}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}
  header: ${JWT_HEADER:Authorization}
  prefix: ${JWT_PREFIX:Bearer }

cloud:
  aws:
    region:
      static: ${AWS_REGION:}
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    s3:
      bucket: ${AWS_S3_BUCKET:}

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
