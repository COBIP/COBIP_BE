spring:
  application:
    name: cobip
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

jwt:
  secret-key: ${JWT_SECRET_KEY:local-development-jwt-secret-key-change-me-32-bytes}
  issuer: ${JWT_ISSUER:cobip}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}
  header: ${JWT_HEADER:Authorization}
  prefix: ${JWT_PREFIX:Bearer }

cloud:
  aws:
    region:
      static: ${AWS_REGION:}
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    s3:
      bucket: ${AWS_S3_BUCKET:}

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://cobip.tech
      - https://www.cobip.tech
  mail:
    from: ${MAIL_FROM:}
  auth:
    email-verification:
      code-expiration-millis: ${EMAIL_VERIFICATION_CODE_EXPIRATION:300000}
      verified-expiration-millis: ${EMAIL_VERIFICATION_VERIFIED_EXPIRATION:1800000}
    password-reset:
      code-expiration-millis: ${PASSWORD_RESET_CODE_EXPIRATION:300000}
      verified-expiration-millis: ${PASSWORD_RESET_VERIFIED_EXPIRATION:1800000}
  judge0:
    base-url: ${JUDGE0_BASE_URL:https://ce.judge0.com}
    auth-header: ${JUDGE0_AUTH_HEADER:X-Auth-Token}
    auth-token: ${JUDGE0_AUTH_TOKEN:}
    connect-timeout-millis: ${JUDGE0_CONNECT_TIMEOUT_MILLIS:5000}
    read-timeout-millis: ${JUDGE0_READ_TIMEOUT_MILLIS:15000}
    poll-timeout-millis: ${JUDGE0_POLL_TIMEOUT_MILLIS:10000}
    poll-interval-millis: ${JUDGE0_POLL_INTERVAL_MILLIS:250}
