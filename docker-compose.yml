services:
  postgres:
    image: postgres:16-alpine
    container_name: cobip-postgres
    environment:
      POSTGRES_DB: cobip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cobip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cobip"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cobip-redis
    ports:
      - "6379:6379"
    volumes:
      - cobip-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cobip-postgres-data:
  cobip-redis-data:
